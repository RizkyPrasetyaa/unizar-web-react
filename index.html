<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Universitas Islam Al-Azhar (UNIZAR) — kampus Rahmatan lil 'Alamin di jantung Kota Mataram yang tumbuh bersama masyarakat Nusa Tenggara Barat sejak 1981." />

    <!-- Plus Jakarta Sans — loaded via Google Fonts for reliable rendering everywhere -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Critical inline CSS — ensures font + colors load immediately, before main CSS -->
    <style>
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background-color: #F7FAF8;
        color: #13231C;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1, h2, h3, h4, h5, h6 {
        margin: 0;
        color: #13231C;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        line-height: 1.15;
      }
      p, span, a, li, td, th, label, button, input, select, textarea, small, b, strong {
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      a { color: #0A6B4F; }
    </style>

    <title>Universitas Islam Al-Azhar (UNIZAR)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
